<!DOCTYPE html>
<html>
<head>
<title>Tiga Panah Bergerak Bersamaan</title>
<style>
  /* Gaya untuk menempatkan container di tengah */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
  }

  /* Container utama panah */
  .arrow-container {
    position: relative;
    width: 400px; /* Lebar untuk menampung pergerakan panah */
    height: 200px; /* Tinggi untuk penempatan awal */
  }

  /* Gaya dasar untuk setiap panah */
  .arrow {
    width: 68px;
    position: absolute;
    top: 50px; /* Posisi awal dari atas container */
    left: 50%; /* Tengah container */
    margin-left: -34px; /* Geser setengah lebar panah ke kiri agar pas di tengah */
    transform-origin: center bottom; /* Titik putar di bagian bawah */
  }

  /* Gaya SVG Panah */
  .arrow svg {
    /* Atur viewBox agar panah menunjuk ke atas */
    /* Asumsi viewBox awal: -3 -1.5 70 104.5. Kita bisa menyesuaikannya. */
    width: 100%;
    height: 100%;
  }

  .arrow path {
    stroke: black;
    fill: red;
    stroke-width: 3;
  }

  /* Posisi dan rotasi awal spesifik */
  #arrow1 {
    /* Panah Kanan: Sedikit miring ke kanan, terjemah ke kanan, terbalik horizontal (scaleX(-1)) */
    transform: rotate(11deg) translateX(120px) translateY(0px) scaleX(-1);
  }

  #arrow2 {
    /* Panah Kiri: Sedikit miring ke kiri, terjemah ke kiri */
    transform: rotate(-11deg) translateX(-120px) translateY(0px);
  }

  #arrow3 {
    /* Panah Tengah: Tidak ada rotasi atau terjemahan horizontal awal */
    transform: translateY(0px);
  }
</style>
</head>
<body>

<div class="arrow-container">
  <div id="arrow1" class="arrow">
    <svg viewBox="-3 -1.5 70 104.5">
      <path d="M0,76 L23,76 L23,0 L41,0 L41,76 L64,76 L32,100 L0,76 L23,76"></path>
    </svg>
  </div>

  <div id="arrow2" class="arrow">
    <svg viewBox="-3 -1.5 70 104.5">
      <path d="M0,76 L23,76 L23,0 L41,0 L41,76 L64,76 L32,100 L0,76 L23,76"></path>
    </svg>
  </div>

  <div id="arrow3" class="arrow">
    <svg viewBox="-3 -1.5 70 104.5">
      <path d="M0,76 L23,76 L23,0 L41,0 L41,76 L64,76 L32,100 L0,76 L23,76"></path>
    </svg>
  </div>
</div>

<script>
  // Ambil elemen-elemen panah
  const arrow1 = document.getElementById('arrow1');
  const arrow2 = document.getElementById('arrow2');
  const arrow3 = document.getElementById('arrow3');

  // Variabel untuk menyimpan posisi Y pergerakan
  let positionY = 0;
  // Variabel untuk arah pergerakan (1 = ke bawah, -1 = ke atas)
  let direction = 1;
  // Kecepatan pergerakan (dalam piksel per frame)
  const speed = 1.5;
  // Batas pergerakan (jarak maksimum dari posisi awal)
  const limit = 50;

  /**
   * Fungsi untuk memperbarui posisi panah
   * @param {number} time - Waktu saat ini (disediakan oleh requestAnimationFrame)
   */
  function animateArrows(time) {
    // 1. Perbarui posisi Y berdasarkan arah dan kecepatan
    positionY += direction * speed;

    // 2. Cek apakah batas pergerakan sudah tercapai
    if (positionY > limit) {
      positionY = limit; // Pastikan tidak melebihi batas
      direction = -1;    // Ubah arah menjadi ke atas
    } else if (positionY < 0) {
      positionY = 0;     // Pastikan tidak kurang dari 0
      direction = 1;     // Ubah arah menjadi ke bawah
    }

    // 3. Terapkan transformasi baru ke setiap panah
    // Ambil string transform awal dari CSS agar pergerakan Y ditambahkan
    
    // Panah 1 (Kanan): rotate(11deg) translateX(120px) scaleX(-1)
    arrow1.style.transform = `rotate(11deg) translateX(120px) translateY(${positionY}px) scaleX(-1)`;
    
    // Panah 2 (Kiri): rotate(-11deg) translateX(-120px)
    arrow2.style.transform = `rotate(-11deg) translateX(-120px) translateY(${positionY}px)`;
    
    // Panah 3 (Tengah): transform default (none)
    arrow3.style.transform = `translateY(${positionY}px)`;


    // 4. Lanjutkan animasi
    requestAnimationFrame(animateArrows);
  }

  // Mulai animasi
  requestAnimationFrame(animateArrows);
</script>

</body>
</html>
